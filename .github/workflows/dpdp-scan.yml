name: DPDP Scan

on:
  pull_request:
  workflow_dispatch:

jobs:
  dpdp_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run DPDP scan action
        uses: ./.github/actions/dpdp-scan
        with:
          target: .
          output: dpdp_pr_report
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build JSON summary
        run: python main.py . --json > dpdp_pr_report.json
      - name: Sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('dpdp_pr_report.json', 'utf8'));
            const delta = payload.delta || {};
            const findings = delta.new_findings || [];
            const bullets = findings.length
              ? findings.map(f => `- [${f.severity}] ${f.rule} — ${f.file || 'N/A'}`).join('\n')
              : '- No new HIGH/MEDIUM findings in this run.';
            const body = [
              '## DPDP Scan',
              `Score: ${payload.compliance_score?.score ?? 'N/A'} (${payload.compliance_score?.grade ?? ''})`,
              '',
              '### New HIGH/MEDIUM findings',
              bullets,
            ].join('\n');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- dpdp-scan-comment -->';
            const fullBody = `${marker}\n${body}`;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body: fullBody});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body: fullBody});
            }
