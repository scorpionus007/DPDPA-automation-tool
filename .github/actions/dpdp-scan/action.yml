name: "DPDP Scan"
description: "Run the DPDP compliance scanner and upload report artifacts."
inputs:
  target:
    description: "Repository URL or local path to scan"
    required: true
  output:
    description: "Output base path"
    required: false
    default: "scan_report"
  github_token:
    description: "Optional GitHub token for private repository access"
    required: false
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run scanner
      shell: bash
      run: |
        python main.py "${{ inputs.target }}" --output "${{ inputs.output }}" --html
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
    - name: Upload reports
      uses: actions/upload-artifact@v4
      with:
        name: dpdp-report
        path: |
          ${{ inputs.output }}.pdf
          ${{ inputs.output }}.html
